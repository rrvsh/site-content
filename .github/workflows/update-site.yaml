name: Refresh site content

on:
  push:
    branches:
      - prime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-site:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out the content
        uses: actions/checkout@v4

      - name: Sign and send the content revision
        env:
          SITE_REFRESH_PRIVATE_KEY: ${{ secrets.SITE_REFRESH_PRIVATE_KEY }}
        run: scripts/refresh-site.sh "${{ github.sha }}"
